<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Park Jam module visual QC</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#f8f3fa;font-family:system-ui,-apple-system,sans-serif}main{width:100%;max-width:430px;margin:auto;padding:8px}#label{margin:.2rem;text-align:center;color:#61436f;font-size:.8rem;font-weight:900}</style></head>
<body><main><p id="label"></p><div id="host"></div></main>
<script type="module">
import game from "../src/games/spatial-park-jam-v1.js";
const query=new URLSearchParams(location.search),scenario=query.get("scenario")||"initial",wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),task=JSON.parse(sessionStorage.getItem("parkVisualTask")||"null");if(!task)throw new Error("parkVisualTask is required");
const SIZE=5,key=cars=>cars.map(car=>`${car.r},${car.c}`).join("|"),solved=cars=>cars[0].c+cars[0].len-1>=4;
function grid(cars){const value=Array.from({length:SIZE},()=>Array(SIZE).fill(-1));for(let index=0;index<cars.length;index++)for(let k=0;k<cars[index].len;k++){const car=cars[index],r=car.r+(car.dir==="v"?k:0),c=car.c+(car.dir==="h"?k:0);if(value[r]?.[c]===undefined||value[r][c]!==-1)return null;value[r][c]=index}return value}
function moves(cars){const value=grid(cars),out=[];cars.forEach((car,index)=>{for(const step of[-1,1])for(let distance=1;distance<SIZE;distance++){const shift=step*distance,r=car.dir==="v"?(step>0?car.r+car.len-1+shift:car.r+shift):car.r,c=car.dir==="h"?(step>0?car.c+car.len-1+shift:car.c+shift):car.c;if(r<0||r>=SIZE||c<0||c>=SIZE||value[r][c]!==-1)break;out.push({index,step,distance})}});return out}
function apply(cars,move){const next=cars.map(car=>({...car})),car=next[move.index],shift=move.step*move.distance;if(car.dir==="h")car.c+=shift;else car.r+=shift;return next}
function solve(initial){const queue=[{cars:initial,path:[]}],seen=new Set([key(initial)]);for(let cursor=0;cursor<queue.length;cursor++){const item=queue[cursor];for(const move of moves(item.cars)){const cars=apply(item.cars,move),path=[...item.path,move];if(solved(cars))return path;const id=key(cars);if(!seen.has(id)&&path.length<9){seen.add(id);queue.push({cars,path})}}}throw new Error("task is unsolved")}
const solution=solve(task.cars);if(solution.length!==task.minMoves)throw new Error(`minMoves mismatch ${solution.length}/${task.minMoves}`);document.querySelector("#label").textContent=`MODULE · ${scenario} · 最短${task.minMoves}手`;
const host=document.querySelector("#host"),controller=new AbortController(),qa={},timers=new Set(),context={host,signal:controller.signal,qa,reducedMotion:false,viewport:{width:innerWidth-16,height:innerHeight,dpr:devicePixelRatio},listen(target,type,fn,options){target.addEventListener(type,fn,options);return()=>target.removeEventListener(type,fn,options)},later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id},frame(){throw new Error("unexpected frame")},setDeadline(){return 1},finish(correct,result){window.__PARK_FINISH__={correct,result};return true}};game.render(task,context);const api=qa[game.metadata.id],reverse=move=>({...move,step:-move.step});
if(scenario==="selected")api.select(solution[0].index);
else if(scenario==="dragging"){const move=solution[0],button=host.querySelectorAll(".apj-car")[move.index],rect=button.getBoundingClientRect(),horizontal=task.cars[move.index].dir==="h",pointerId=9;button.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerId,clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2}));button.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,pointerId,clientX:rect.left+rect.width/2+(horizontal?38*move.step:0),clientY:rect.top+rect.height/2+(horizontal?0:38*move.step)}));await wait(50)}
else if(scenario==="legal"){api.move(solution[0]);await wait(250)}
else if(scenario==="illegal"){api.select(0);const occupied=new Set();task.cars.forEach(car=>{for(let i=0;i<car.len;i++)occupied.add(`${car.r+(car.dir==="v"?i:0)},${car.c+(car.dir==="h"?i:0)}`)});outer:for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(r!==2&&!occupied.has(`${r},${c}`)){api.chooseCell(r,c);break outer}await wait(50)}
else if(scenario==="correct"){for(const move of solution){api.move(move);await wait(235)}await wait(400)}
else if(scenario==="limit"){const first=solution[0],back=reverse(first);for(let i=0;i<task.moveLimit;i++){api.move(i%2?back:first);await wait(230)}}
window.__PARK_MODULE__={task,solution,qa,context};document.body.dataset.ready="true";document.body.dataset.scenario=scenario;
</script></body></html>
