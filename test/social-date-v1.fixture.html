{kind:"dateSim",prompt:"会話をつないで、デートに誘って",help:"相手の話を受けて、3回選びます。",scenario:{name:"蒼真",age:26,role:"ブックカフェで会った青年",image:"assets/date-anime.webp",alt:"夕方のブックカフェにいる架空の成人男性",closing:"その誘い、うれしい。次の休みに行こう。",steps:[{line:"この店、静かで落ち着くんだ。よく来るの？",answer:"初めて。おすすめの本、教えてくれる？",choices:["初めて。おすすめの本、教えてくれる？","静かすぎて眠くなりそう","本よりスマホのほうが好き"]},{line:"映画の原作になった短編が好きかな。君は映画も観る？",answer:"観るよ。原作と比べるのも楽しそう",choices:["観るよ。原作と比べるのも楽しそう","結末だけ教えて","長い話は全部苦手"]},{line:"今度、その作品の上映があるんだ。",answer:"よかったら、一緒に観に行かない？",choices:["よかったら、一緒に観に行かない？","ひとりで楽しんできて","感想だけあとで送って"]}]},duration:18000},
{kind:"dateSim",prompt:"会話をつないで、デートに誘って",help:"相手の話を受けて、3回選びます。",scenario:{name:"蓮",age:32,role:"架空の映画俳優",image:"assets/date-actor.webp",alt:"夕暮れの映画セットにいる架空の成人男性俳優",closing:"いいね。撮影のない日に、二人で行こう。",steps:[{line:"やっと撮影が終わった。今日は少し難しい場面でね。",answer:"おつかれさま。どんなところが難しかったの？",choices:["おつかれさま。どんなところが難しかったの？","有名人も大変だね","それより写真を撮って"]},{line:"言葉より表情で伝える場面だったんだ。静かな映画は好き？",answer:"好き。表情を追うのも面白いよね",choices:["好き。表情を追うのも面白いよね","派手な場面だけ観たい","途中で寝るかも"]},{line:"小さな映画館で、昔の作品を観直したいと思ってる。",answer:"今度、その映画館に一緒に行かない？",choices:["今度、その映画館に一緒に行かない？","場所だけ教えて","誰か誘えば？"]}]},duration:18000},

],host=document.querySelector("#game-host"),label=document.querySelector("#fixture-label"),prompt=document.querySelector("#prompt"),help=document.querySelector("#help"),resultNode=document.querySelector("#fixture-result"),errors=[];let runtime=null,qa=null,result=null,lastTask=null;
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
function start({family=0,task=TASKS[family],width=innerWidth,height=innerHeight,dpr=devicePixelRatio,reducedMotion=false}={}){runtime?.dispose();host.replaceChildren();qa={};result=null;resultNode.textContent="";lastTask=structuredClone(task);prompt.textContent=lastTask.prompt;help.textContent=lastTask.help;runtime=createGameRuntime({host,qa,reducedMotion,viewport:{width,height,dpr},onFinish:(correct,detail)=>{result={correct,detail};resultNode.textContent=`${correct?"成功":"失敗"} · ${detail.detail||""}`}});game.render(lastTask,{...runtime.context,qa,reducedMotion,viewport:{width,height,dpr}});label.textContent=`${lastTask.scenario.name} · ${width}×${height} DPR${dpr}${reducedMotion?" reduced":""}`;return structuredClone(lastTask)}
const api=()=>qa?.[game.metadata.id],answer=index=>{const current=api(),ok=current.choose(lastTask.scenario.steps[index].answer);if(index<2)current.completeTransition();return ok};function scenario(name){if(name==="step1")answer(0);else if(name==="step2"){answer(0);answer(1)}else if(name==="wrong")api().choose(lastTask.scenario.steps[0].choices.find(value=>value!==lastTask.scenario.steps[0].answer));else if(name==="success"){answer(0);answer(1);const current=api();current.choose(lastTask.scenario.steps[2].answer);current.completeFinish()}else if(name==="timeout"){answer(0);api().expire()}document.body.dataset.ready="true";document.body.dataset.scenario=name}
window.socialDateFixture={game,start,scenario,dispose(){runtime?.dispose()},inspect(){return api()?.inspect?.()||null},choose(value){return api()?.choose?.(value)},answer,focus(index){return api()?.focus?.(index)},move(direction){return api()?.move?.(direction)},complete(){return api()?.completeTransition?.()},completeFinish(){return api()?.completeFinish?.()},expire(){return api()?.expire?.()},runtime(){return runtime?.inspect()||null},task(){return structuredClone(lastTask)},result(){return result?structuredClone(result):null},errors(){return[...errors]}};
const query=new URLSearchParams(location.search),family=Math.max(0,Math.min(2,Number(query.get("family"))||0)),name=query.get("scenario")||"initial",reducedMotion=query.get("reduced")==="1";start({family,width:innerWidth,height:innerHeight,dpr:devicePixelRatio,reducedMotion});scenario(name);
