<!doctype html><html lang="ja"><head><meta charset="utf-8"><base href="../"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>language-particle-scene-v1 fixture</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#ece8df;color:#37322d;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}body{display:flex;justify-content:center}main{width:100%;max-width:29rem;min-height:100dvh;padding:1rem .85rem 2rem}.fixture-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 .42rem;color:#695d50;font-size:.66rem;font-weight:900}.fixture-card{padding:.82rem .72rem;border:1px solid #d4cabd;border-radius:1.25rem;background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(62,50,36,.13)}h1{margin:0 0 .18rem;text-align:center;font-size:1.08rem;line-height:1.35}.help{margin:0 0 .52rem;color:#70675e;text-align:center;font-size:.72rem;font-weight:750;line-height:1.4}.result{min-height:1.2rem;margin:.45rem 0 0;padding:.32rem .45rem;border-radius:.62rem;text-align:center;font-size:.69rem;font-weight:900}.result[data-correct=true]{background:#e3f2e6;color:#2f6440}.result[data-correct=false]{background:#f7e3e6;color:#853a45}</style></head><body><main><header class="fixture-head"><span>初老テスト。original module</span><span id="fixture-label"></span></header><section class="fixture-card"><h1 id="prompt"></h1><p class="help" id="help"></p><div id="game-host"></div><p class="result" id="fixture-result" aria-live="polite"></p></section></main><script type="module">
import game from "../src/games/language-particle-scene-v1.js";import{createGameRuntime}from"../src/game-kernel.js";
