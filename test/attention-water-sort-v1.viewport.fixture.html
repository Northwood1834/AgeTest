<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'"><title>water-sort viewport fixture</title><style>*{box-sizing:border-box}html,body{margin:0;background:#222}iframe{display:block;border:0;margin:0;background:#f8f4fa}pre{display:none}</style></head>
<body><iframe id="game" title="water-sort viewport"></iframe><pre id="fixture-result"></pre>
<script>
const params=new URL(location.href).searchParams,width=Number(params.get("width"))||390,height=Number(params.get("height"))||844,scenario=params.get("scenario")||"view";
const frame=document.querySelector("#game");frame.style.width=`${width}px`;frame.style.height=`${height}px`;frame.src=`./attention-water-sort-v1.fixture.html?scenario=${encodeURIComponent(scenario)}`;
frame.addEventListener("load",()=>{const check=setInterval(()=>{try{const doc=frame.contentDocument;if(doc?.documentElement.dataset.fixtureDone!=="true")return;clearInterval(check);const child=JSON.parse(doc.querySelector("#fixture-result").textContent),view=frame.contentWindow;const report={requested:{width,height,dpr:view.devicePixelRatio},actual:{width:view.innerWidth,height:view.innerHeight,clientWidth:doc.documentElement.clientWidth,clientHeight:doc.documentElement.clientHeight,scrollWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>view.innerWidth},child};document.querySelector("#fixture-result").textContent=JSON.stringify(report);document.documentElement.dataset.fixtureDone="true"}catch(error){clearInterval(check);document.querySelector("#fixture-result").textContent=JSON.stringify({error:String(error)});document.documentElement.dataset.fixtureDone="true"}},20)});
</script></body></html>
