<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>prediction-lane3d-v1 parity fixture</title><style>html,body{margin:0;min-height:100%;background:#111b21;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}body{display:flex;justify-content:center}#shell{width:100%;max-width:430px;min-height:100vh;padding:.6rem;box-sizing:border-box;color:#252128;background:#f7f4ef}#legacy-head p{margin:.15rem 0;color:#6d6670;font-size:.78rem}#legacy-head h2{margin:.2rem 0;font-size:1.25rem}.stage3d{--stage-perspective:520px;position:relative;width:100%;height:12rem;margin:.7rem 0 .75rem;overflow:hidden;border:1.5px solid #ddd5df;border-radius:1.25rem;background:#f8f3fa;perspective:var(--stage-perspective);isolation:isolate}.stage3d-world{position:absolute;inset:0;transform-style:preserve-3d}.lane-stage{height:11.5rem;background:linear-gradient(#c8e4fa 0 40%,#8cc274 41%);overflow:hidden}.lane-road{position:absolute;left:13%;right:13%;top:-5%;bottom:-23%;display:grid;grid-template-columns:repeat(3,1fr);gap:.2rem;padding:.48rem;background:linear-gradient(90deg,#39343d,#5f5864 50%,#39343d);border:3px solid #e8e4ea;transform:rotateX(53deg);transform-origin:50% 100%;box-shadow:0 14px 30px rgba(36,29,39,.25);transform-style:preserve-3d}.lane-strip{position:relative;border:2px dashed rgba(255,255,255,.78);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.09));display:flex;align-items:center;justify-content:center}.lane-strip span{font-size:2.7rem;filter:drop-shadow(0 5px 4px rgba(0,0,0,.28));transform:rotateX(-40deg) translateZ(20px)}.legacy-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem}.legacy-choice{min-height:3.5rem;border:1px solid #d7cfd9;border-radius:.85rem;background:#fff;color:#312a35;font-weight:850;font-size:.78rem}.legacy-choice:nth-child(3){grid-column:1/-1}.legacy-choice:focus-visible{outline:3px solid rgba(166,109,194,.5);outline-offset:2px}.le <body><main id="shell"><div id="host"></div></main><script type="module">
import game from "../src/games/prediction-lane3d-v1.js";
const params=new URLSearchParams(location.search),mode=params.get("mode")||"module",scenario=params.get("scenario")||"initial",reduced=params.get("reduced")==="1",task={kind:"lane3d",prompt:"安全なレーンを未来予知",help:"障害物がない道を選んで。",lanes:["🚗","🍀","🦖"],options:["左","中央","右"],answer:"中央",duration:7000},taskJSON=JSON.stringify(task),host=document.querySelector("#host"),errors=[],external=[],finishes=[],jobs=new Map(),listeners=[],controller=new AbortController();let nextJob=0,deadline=null,disposed=false,api=null;
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message||event.error)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms)),wait=async(predicate,timeout=4000)=>{const start=performance.now();while(!predicate()){if(performance.now()-start>timeout)throw new Error(`wait timeout ${mode} ${scenario}`);await sleep(16)}};
function renderLegacy(){const head=document.createElement("header");head.id="legacy-head";const title=document.createElement("h2"),help=document.createElement("p"),time=document.createElement("div");title.textContent=task.prompt;help.textContent=task.help;time.className="legacy-time";time.textContent="7 SEC";head.append(title,help,time);const scene=document.createElement("div"),world=document.createElement("div"),road=document.createElement("div");scene.className="stage3d lane-stage";scene.setAttribute("role","group");scene.setAttribute("aria-label","三本のレーンがある3D道路");world.className="stage3d-world";road.className="lane-road";task.lanes.forEach(emoji=>{const lane=document.createElement("div"),marker=document.createElement("span");lane.className="lane-strip";marker.textContent=emoji;marker.setAttribute("aria-hidden","true");lane.append(marker);road.append(lane)});world.append(road);scene.append(world);const choices=document.createElement("div"),buttons=[];choices.className="legacy-choices";const feedback=document.createElement("div"),feedbackTitle=document.createElement("b"),feedbackDetail=document.createElement("span");feedback.className="legacy-feedback";feedback.append(feedbackTitle,feedbackDetail);let done=false,choice=null,result=null;const finish=(correct,reason,index=null)=>{if(done)return false;done=true;choice=index;result=reason;buttons.forEach(button=>button.disabled=true);feedback.classList.add("show");feedback.classList.toggle("bad",!correct);feedbackTitle.textContent=correct?"○ 正解":"× 残念";feedbackDetail.textContent=correct?"安全なレーンです":reason==="timeout"?`正解は「${task.answer}」`:`正解は「${task.answer}」`;finishes.push({correct,result:{reason,choice:index===null?null:task.options[index],answerLabel:task.answer}});return true};task.options.forEach((value,index)=>{const button=document.createElement("button");button.type="button";button.className="legacy-choice";button.textContent=value;button.addEventListener("click",()=>finish(value===task.answer,value===task.answer?"success":"wrong",index));buttons.push(button);choices.append(button)});host.append(head,scene,choices,feedback);api={choose:index=>{buttons[index]?.click();return true},focus:index=>{buttons[index]?.focus();return true},timeout:()=>finish(false,"timeout"),inspect:()=>({phase:done?"DONE":"SELECT",focus:buttons.indexOf(document.activeElement),choice,done,result,options:buttons.map(button=>({text:button.textContent,disabled:button.disabled})),taskJSON})}}
function renderModule(){const qa={},later=(fn,ms)=>{const token=++nextJob,id=setTimeout(()=>{jobs.delete(token);if(!disposed)fn()},ms);jobs.set(token,{id,ms});return()=>{clearTimeout(id);jobs.delete(token)}},context={host,signal:controller.signal,reducedMotion:reduced,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},qa,later,frame:()=>{throw new Error("unexpected frame")},listen:(target,type,fn,options)=>{target.addEventListener(type,fn,options);const remove=()=>target.removeEventListener(type,fn,options);listeners.push(remove);return remove},setDeadline:(ms,fn)=>{const token=++nextJob,id=setTimeout(()=>{jobs.delete(token);deadline=null;if(!disposed)fn()},ms);deadline={token,id,fn};jobs.set(token,{id,ms});return id},finish:(correct,result)=>finishes.push({correct,result})};game.render(task,context);api=qa[game.metadata.id]}
async function prepare(){mode==="legacy"?renderLegacy():renderModule();if(scenario==="initial")return;if(scenario==="focus"){api.focus(0);return}if(scenario==="wrong"){api.choose(0);if(mode==="module")await wait(()=>api.inspect().done);return}if(scenario==="success"){api.choose(1);if(mode==="module")await wait(()=>api.inspect().done);return}if(scenario==="timeout"){if(mode==="legacy")api.timeout();else{deadline.fn();clearTimeout(deadline.id);jobs.delete(deadline.token);deadline=null;await wait(()=>api.inspect().done)}return}throw new Error(`unknown scenario ${scenario}`)}
window.__LANE3D_FIXTURE__={game,task,taskJSON,mode,scenario,reduced,api:()=>api,errors,external,finishes,activeJobs:()=>jobs.size,triggerDeadline:()=>{if(deadline){deadline.fn();clearTimeout(deadline.id);jobs.delete(deadline.token);deadline=null}},dispose:()=>{if(disposed)return;disposed=true;for(const job of jobs.values())clearTimeout(job.id);jobs.clear();controller.abort();listeners.forEach(remove=>remove())},report:()=>({mode,scenario,reduced,task,taskJSON,inspect:api.inspect(),errors:[...errors],external:[...external],finishes:[...finishes],jobs:jobs.size})};
try{await prepare();for(const entry of performance.getEntriesByType("resource")){const url=new URL(entry.name,location.href);if(url.origin!==location.origin)external.push(entry.name)}document.body.dataset.ready="true"}catch(error){errors.push(String(error.stack||error));document.body.dataset.ready="error"}
</script></body></html>
