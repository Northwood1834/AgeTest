<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rope Untangle fixture</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f8f3fa;font-family:system-ui,-apple-system,sans-serif}body{padding:8px}main{width:100%;max-width:430px;margin:auto}h1{margin:.15rem;text-align:center;color:#593b69;font-size:1.05rem}#result{margin:.2rem;text-align:center;color:#65586d;font-size:.75rem}</style></head><body><main><h1>ロープの交差をゼロに</h1><div id="host"></div><p id="result"></p></main><script type="module">
import game from "../src/games/spatial-rope-untangle-v1.js";
const query=new URLSearchParams(location.search),scenario=query.get("scenario")||"initial";let seed=Number(query.get("seed"))||0x81e7;const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/2**32),randomInt=(min,max)=>min+Math.floor(random()*(max-min+1));const generated=game.generate({random,randomInt,pick:v=>v[randomInt(0,v.length-1)],shuffle:v=>[...v]}),task=structuredClone(generated);if(scenario==="resume")delete task.solution;
const host=document.querySelector("#host"),result=document.querySelector("#result"),controller=new AbortController(),qa={},timers=new Set(),frames=new Set(),removers=[];let deadline=null,finished=[];
const context={host,signal:controller.signal,qa,reducedMotion:query.get("reduced")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches,viewport:{width:innerWidth-16,height:innerHeight,dpr:devicePixelRatio},listen(target,type,fn,options){target.addEventListener(type,fn,options);const remove=()=>target.removeEventListener(type,fn,options);removers.push(remove);return remove},later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id},frame(fn){let stopped=false,id;const tick=time=>{frames.delete(id);if(stopped)return;if(fn(time)!==false){id=requestAnimationFrame(tick);frames.add(id)}};id=requestAnimationFrame(tick);frames.add(id);return()=>{stopped=true;cancelAnimationFrame(id);frames.delete(id)}},setDeadline(ms,fn){deadline=fn;return 1},finish(correct,detail){if(finished.length)return false;finished.push({correct,detail});result.textContent=correct?"正解":"不正解";return true}};
game.render(task,context);const api=qa[game.metadata.id],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),pegs=()=>host.querySelectorAll(".aru-peg");
if(scenario==="dragging"){const index=0,button=pegs()[index],rect=button.getBoundingClientRect(),target=task.solution[index],board=host.querySelector(".aru-board").getBoundingClientRect(),pointerId=7;button.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerId,clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2}));button.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,pointerId,clientX:board.left+(task.points[index].x+target.x)/2*board.width,clientY:board.top+(task.points[index].y+target.y)/2*board.height}));await wait(70)}
else if(scenario==="decrease"){for(let i=0;i<task.nodes&&api.inspect().crossings>=task.start;i++){api.select(i);api.align()}await wait(180)}
else if(scenario==="illegal"){const button=pegs()[0],rect=button.getBoundingClientRect(),target=pegs()[1].getBoundingClientRect(),pointerId=8;button.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerId,clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2}));button.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,pointerId,clientX:target.left+target.width/2,clientY:target.top+target.height/2}));await wait(70)}
else if(scenario==="correct"||scenario==="resume"){api.solve();await wait(900)}
else if(scenario==="timeout"){deadline();await wait(30)}
else if(scenario==="dispose"){api.solve();controller.abort();timers.forEach(clearTimeout);frames.forEach(cancelAnimationFrame);removers.forEach(remove=>remove());await wait(850)}
await wait(40);document.body.dataset.ready="true";window.__ROPE_FIXTURE__={game,task,api,context,finished,dispose(){controller.abort();timers.forEach(clearTimeout);frames.forEach(cancelAnimationFrame);removers.forEach(remove=>remove())}};
</script></body></html>
