<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>attention-farm-close-v1 module fixture</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#eee9e0;color:#403b39;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}body{display:flex;justify-content:center}main{width:100%;max-width:29rem;min-height:100dvh;padding:1.45rem 1.05rem 2.1rem}.fixture-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 .5rem;padding:0 .1rem;color:#76543d;font-size:.71rem;font-weight:900}.fixture-card{padding:1.12rem .9rem 1rem;border:1px solid #ded2c3;border-radius:1.35rem;background:rgba(255,255,255,.96);box-shadow:0 8px 25px rgba(67,48,36,.13)}h1{margin:0 0 .18rem;text-align:center;font-size:1.24rem;line-height:1.3}.help{margin:0 0 .58rem;color:#786c63;text-align:center;font-size:.75rem;font-weight:700;line-height:1.38}.result{min-height:1.35rem;margin:.5rem 0 0;color:#355f40;text-align:center;font-size:.76rem;font-weight:900}</style></head>
<body><main><header class="fixture-head"><span>初老テスト。新作</span><span id="fixture-label"></span></header><section class="fixture-card"><h1 id="prompt"></h1><p class="help" id="help"></p><div id="game-host"></div><p class="result" id="fixture-result" aria-live="polite"></p></section></main>
<script type="module">
import game from "../src/games/attention-farm-close-v1.js";
import {createGameRuntime} from "../src/game-kernel.js";
const FIXED_TASK=game.generate({randomInt:min=>min});
const host=document.querySelector("#game-host"),label=document.querySelector("#fixture-label"),prompt=document.querySelector("#prompt"),help=document.querySelector("#help"),resultNode=document.querySelector("#fixture-result"),errors=[];
let runtime=null,qa=null,result=null,lastTask=null;
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function start({task=FIXED_TASK,width=innerWidth,height=innerHeight,dpr=devicePixelRatio,reduced=false,deadlineOverride=null}={}){
  runtime?.dispose();host.replaceChildren();qa={};result=null;resultNode.textContent="";lastTask=structuredClone(task);prompt.textContent=lastTask.prompt;help.textContent=lastTask.help;
  runtime=createGameRuntime({host,qa,reducedMotion:reduced,viewport:{width,height,dpr},onFinish:(correct,detail)=>{result={correct,detail};resultNode.textContent=`${correct?"成功":"失敗"} · ${detail.detail||detail.reason||""}`}});
  const context={...runtime.context,qa,reducedMotion:reduced,viewport:{width,height,dpr}};if(deadlineOverride!==null){const owned=context.setDeadline;context.setDeadline=(_ms,fn)=>owned(deadlineOverride,fn)}game.render(lastTask,context);label.textContent=`${width}×${height} DPR${dpr}${reduced?" reduced":""}`;return structuredClone(lastTask);
}
const api=()=>qa?.[game.metadata.id];
const take=id=>{api().collect(id);api().completeTransition()};
const put=id=>{api().selectHeld(id);api().store(lastTask.tools.find(tool=>tool.id===id).zone);api().completeTransition()};
function storeTrip(index){const trip=lastTask.proof.trips[index];for(const id of trip)take(id);for(const id of trip)put(id)}
function storeAll(){for(let index=0;index<lastTask.proof.trips.length;index++)storeTrip(index)}
function enterCheck(){storeAll();api().closeFarm();api().completeTransition()}
function enterDrive(){enterCheck();api().check("bed");api().completeTransition();api().check("gate");api().completeTransition()}
async function scenario(name){
  if(name==="collect")take("hoe");
  else if(name==="capacity"){take("hoe");take("rake");api().collect("sickle")}
  else if(name==="store"){take("hoe");take("rake");put("hoe")}
  else if(name==="store-rack")storeTrip(0);
  else if(name==="store-locker"){storeTrip(0);storeTrip(1)}
  else if(name==="store-shelf"){storeTrip(0);storeTrip(1);take("basket");put("basket")}
  else if(name==="store-reel")storeAll();
  else if(name==="check"){enterCheck();api().check("bed");api().completeTransition()}
  else if(name==="drive"||name==="drive-choice")enterDrive();
  else if(name==="success"){enterDrive();for(const choice of lastTask.roadChoices){api().drive(choice);api().completeTransition()}await wait(90)}
  else if(name==="wrong-zone"){take("sickle");api().store("rack")}
  else if(name==="left-behind"){take("hoe");api().closeFarm()}
  else if(name==="check-failure"){enterCheck();api().check("gate")}
  else if(name==="drive-failure"){enterDrive();const expected=api().inspect().expected,wrong=["left","straight","right"].find(choice=>choice!==expected);api().drive(wrong)}
  else if(name==="sunset"){for(const tool of lastTask.tools){if(!api()||api().inspect().done)break;const taking=api().collect(tool.id);if(taking==="sunset")break;api().completeTransition();api().selectHeld(tool.id);const storing=api().store(tool.zone);if(storing==="sunset")break;api().completeTransition()}}
  const terminalNames=["wrong-zone","left-behind","check-failure","drive-failure","sunset"];
  if(!reduced&&name==="success")await wait(800);else if(!reduced&&terminalNames.includes(name))await wait(670);if(reduced)await wait(230);await wait(35);document.body.dataset.ready="true";document.body.dataset.scenario=name;
}
window.farmFixture={game,start,scenario,dispose(){runtime?.dispose()},inspect(){return api()?.inspect?.()||null},collect(id){return api()?.collect?.(id)},select(id){return api()?.selectHeld?.(id)},store(id){return api()?.store?.(id)},closeFarm(){return api()?.closeFarm?.()},check(id){return api()?.check?.(id)},drive(id){return api()?.drive?.(id)},complete(){return api()?.completeTransition?.()},runtime(){return runtime?.inspect()||null},task(){return structuredClone(lastTask)},result(){return result?structuredClone(result):null},errors(){return[...errors]}};
const query=new URLSearchParams(location.search),name=query.get("scenario")||"initial",reduced=query.get("reduced")==="1",deadline=name==="timeout"?120:null;start({width:innerWidth,height:innerHeight,dpr:devicePixelRatio,reduced,deadlineOverride:deadline});if(name==="timeout"){await wait(180);document.body.dataset.ready="true";document.body.dataset.scenario=name}else await scenario(name);
</script></body></html>
