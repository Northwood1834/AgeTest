<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../style.css"><title>Chain puzzle module fixture</title><style>#game-view{display:block!important}.fixture-result{min-height:1.2em;margin:.35rem 0 0;text-align:center;color:#66586f;font-size:.78rem;font-weight:900}</style></head>
<body><main><section id="game-view" class="view"><div class="game-head"><button class="round-button" type="button" aria-label="ホームに戻る">×</button><div class="game-progress-wrap"><div class="game-progress-copy"><span>1 / 12</span><span>+0 XP</span></div><div class="game-progress"><i style="width:8.33%"></i></div></div><span class="level-chip">Lv.1</span></div><div class="category-reveal"><span>🔮</span><strong>未来予知</strong><em>Tier 2</em></div><section class="question-card card"><div class="timer-track"><i style="width:100%"></i></div><p class="question-kicker">問題</p><h2 id="question-prompt"></h2><p id="question-help" class="question-help"></p><div id="challenge" class="challenge" aria-live="polite"></div></section><p class="game-note">正しさ優先。速さは、ちょっとだけ加点。</p><p id="result" class="fixture-result"></p></section></main>
<script>window.__FIXTURE_ERRORS__=[];const oldError=console.error.bind(console);console.error=(...args)=>{__FIXTURE_ERRORS__.push(args.map(String).join(" "));oldError(...args)};addEventListener("error",event=>__FIXTURE_ERRORS__.push(event.error?.stack||event.message));addEventListener("unhandledrejection",event=>__FIXTURE_ERRORS__.push(event.reason?.stack||String(event.reason)));</script>
<script type="module">
import game from "../src/games/prediction-chain-puzzle-v1.js";
const params=new URLSearchParams(location.search),scenario=params.get("scenario")||"initial";let seed=Number(params.get("seed"))||4876;const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/2**32),randomInt=(a,b)=>a+Math.floor(random()*(b-a+1)),pick=values=>values[randomInt(0,values.length-1)],shuffle=values=>{const out=[...values];for(let index=out.length-1;index;index--){const other=randomInt(0,index);[out[index],out[other]]=[out[other],out[index]]}return out};
const saved=localStorage.getItem("pcp-qa-task"),task=saved?JSON.parse(saved):game.generate({random,randomInt,pick,shuffle});document.querySelector("#question-prompt").textContent=task.prompt;document.querySelector("#question-help").textContent=task.help;
const host=document.querySelector("#challenge"),result=document.querySelector("#result"),controller=new AbortController(),qa={},jobs=new Set(),frames=new Set(),finished=[];let deadline=null;const reduced=params.get("reduced")==="1",context={host,signal:controller.signal,qa,reducedMotion:reduced,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},listen(target,type,fn,options){target.addEventListener(type,fn,options);return()=>target.removeEventListener(type,fn,options)},later(fn,ms){const id=setTimeout(()=>{jobs.delete(id);fn()},ms);jobs.add(id);return id},frame(fn){let id;const tick=time=>{frames.delete(id);if(controller.signal.aborted)return;if(fn(time)!==false){id=requestAnimationFrame(tick);frames.add(id)}};id=requestAnimationFrame(tick);frames.add(id);return()=>{cancelAnimationFrame(id);frames.delete(id)}},setDeadline(ms,fn){deadline=fn;return 1},finish(correct,detail){if(finished.length)return false;finished.push({correct,detail});result.textContent=correct?"正解":"不正解";return true}};
game.render(task,context);const api=qa[game.metadata.id],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),outcomes=api.outcomes(),wrong=outcomes.findIndex(chain=>chain>=0&&chain<task.target),decoy=outcomes.findIndex(chain=>chain>0&&chain<task.target),full=task.board[0].findIndex(Boolean);
if(scenario==="input"){const target=document.querySelectorAll(".pcp-key")[Math.max(0,task.bestCol-1)];target.focus();target.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true}));await wait(70)}
else if(scenario==="progress"){api.choose(task.bestCol);await wait(reduced?5:720)}
else if(scenario==="invalid"){if(full>=0&&task.board.every(row=>row[full]))api.choose(full);else{api.choose(task.bestCol);api.choose((task.bestCol+1)%7)}await wait(reduced?2:90)}
else if(scenario==="success"){api.choose(task.bestCol);await wait(reduced?80:2600)}
else if(scenario==="failure"){api.choose(decoy>=0?decoy:wrong);await wait(reduced?80:1700)}
else if(scenario==="timeout"){deadline();await wait(reduced?5:80)}
else await wait(90);
document.body.dataset.ready="true";window.__PUZZLE_FIXTURE__={game,task,api,finished,errors:window.__FIXTURE_ERRORS__,activeJobs:()=>jobs.size,activeFrames:()=>frames.size,dispose(){controller.abort();for(const id of jobs)clearTimeout(id);for(const id of frames)cancelAnimationFrame(id);jobs.clear();frames.clear()}};
</script></body></html>
