<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>reaction-target-v1 parity fixture</title><style>html,body{margin:0;min-height:100%;background:#e9e4eb;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}body{display:flex;justify-content:center}#shell{width:100%;max-width:430px;min-height:100vh;padding:.7rem;box-sizing:border-box;color:#342d38;background:#f7f4f8}.head{padding:.45rem .3rem .8rem}.head h2{min-height:3rem;margin:.15rem 0;font-size:1.23rem;line-height:1.45}.head p{min-height:1.5rem;margin:.15rem 0;color:#76657f;font-size:.74rem;font-weight:650}.timer{height:.28rem;margin:.15rem 0 .7rem;overflow:hidden;border-radius:999px;background:#f0eaf3}.timer i{display:block;width:100%;height:100%;background:#a76bc2}.legacy-target-arena{position:relative;height:13rem;overflow:hidden;border:1.5px dashed #d8c6e2;border-radius:1.25rem;background:linear-gradient(135deg,#fcfafd,#f4ecf8);outline:none}.legacy-moving-target{position:absolute;left:0;top:0;width:3.2rem;height:3.2rem;padding:0;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4ddfb 0 13%,#b977d4 15% 42%,#7d4a94 44% 100%);box-shadow:0 8px 15px rgba(108,63,128,.25);will-change:transform}.legacy-moving-target::after{content:"";position:absolute;inset:.72rem;border:3px solid #fff;border-radius:50%}.legacy-moving-target:focus-visible{outline:3px solid #f2a63a;outline-offset:4px}.legacy-feedback{margin-top:.75rem;padding:.75rem;border:1.5px solid #8ebda2;border-radius:1rem;background:#eef8f1;text-align:center}.legacy-feedback.bad{border-color:#d8959c;background:#fff0f1}.legacy-feedback[hidden]{display:none}.legacy-feedback b,.legacy-feedback span{display:block}.legacy-feedback span{margin-top:.2rem;font-size:.74rem}</style></head><body><main id="shell"><header class="head"><div class="timer"><i></i></div><h2></h2><p></p></header><div id="host"></div></main><script type="module">

function renderLegacy(){const arena=document.createElement("div"),target=document.createElement("button");arena.className="legacy-target-arena";arena.tabIndex=0;arena.setAttribute("role","group");target.type="button";target.className="legacy-moving-target";target.setAttribute("aria-label","紫の的");target.hidden=true;let phase="HIDDEN",appeared=0,caught=false,x=0,y=0,vx=0,vy=0,last=0,result=null,finishCalls=0,frameSamples=0,randomCalls=0;const random=()=>{randomCalls++;return sample()},finish=(correct,next)=>{if(caught)return false;caught=true;result=next;finishCalls++;frames.forEach(frame=>frame.active=false);showLegacyFeedback(correct,next);finishes.push({correct,result:next});phase=correct?"CAUGHT":next.detail==="紫は逃げ切りました。"?"TIMEOUT":"MISS";return true},catchTarget=event=>{event.preventDefault();event.stopPropagation();if(caught||!appeared)return false;const ms=clock-appeared,rounded=Math.round(ms);return finish(true,{reactionMs:rounded,quality:Math.max(0,Math.min(1,1-ms/4000)),detail:`確保まで ${rounded} ms`})},paint=()=>target.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`,xSpeed=()=>arena.clientWidth*(.4+random()*.1),ySpeed=()=>arena.clientHeight*(.36+random()*.1),step=now=>{if(caught)return false;const dt=Math.min(Math.max((now-last)/1000,0),.04),right=Math.max(0,arena.clientWidth-target.offsetWidth),bottom=Math.max(0,arena.clientHeight-target.offsetHeight);last=now;x+=vx*dt;y+=vy*dt;if(x<=0){x=0;vx=xSpeed()}else if(x>=right){x=right;vx=-xSpeed()}if(y<=0){y=0;vy=ySpeed()}else if(y>=bottom){y=bottom;vy=-ySpeed()}paint();frameSamples++;return true},appear=()=>{if(caught)return false;appeared=clock;target.hidden=false;const width=arena.clientWidth,height=arena.clientHeight,maxX=Math.max(0,width-target.offsetWidth),maxY=Math.max(0,height-target.offsetHeight);x=Math.max(0,Math.min(maxX,task.x/100*width));y=Math.max(0,Math.min(maxY,task.y/100*height));paint();phase="APPEARED";if(reduced)return true;vx=(random()<.5?-1:1)*xSpeed();vy=(random()<.5?-1:1
