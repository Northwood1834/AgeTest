<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Foil Strike fixture</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#ece8f2;font-family:system-ui,-apple-system,sans-serif}body{padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}#shell{width:100%;max-width:430px;margin:auto}h1{margin:.08rem 0 .2rem;text-align:center;color:#412f51;font-size:.95rem}#result{min-height:1.1em;margin:.15rem 0;text-align:center;color:#62566b;font-size:.72rem;font-weight:850}</style></head>
<body><main id="shell"><h1>フォイル・ストライク</h1><div id="host"></div><p id="result"></p></main><script>window.__FIXTURE_ERRORS__=[];const oldError=console.error.bind(console);console.error=(...args)=>{__FIXTURE_ERRORS__.push(args.map(String).join(" "));oldError(...args)};addEventListener("error",event=>__FIXTURE_ERRORS__.push(event.error?.stack||event.message));addEventListener("unhandledrejection",event=>__FIXTURE_ERRORS__.push(event.reason?.stack||String(event.reason)));</script>
<script type="module">
import game from "../src/games/prediction-card-combo-v1.js";
const params=new URLSearchParams(location.search),scenario=params.get("scenario")||"draw",seedValue=Number(params.get("seed"))||2020;let seed=seedValue>>>0;const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/2**32),randomInt=(a,b)=>a+Math.floor(random()*(b-a+1)),shuffle=values=>{const out=[...values];for(let i=out.length-1;i;i--){const j=randomInt(0,i);[out[i],out[j]]=[out[j],out[i]]}return out};const task=game.generate({random,randomInt,shuffle,pick:v=>v[randomInt(0,v.length-1)]});
const host=document.querySelector("#host"),result=document.querySelector("#result"),controller=new AbortController(),qa={},jobs=new Set(),frames=new Set(),finished=[];let deadline=null;const context={host,signal:controller.signal,qa,reducedMotion:params.get("reduced")==="1",viewport:{width:innerWidth-12,height:innerHeight,dpr:devicePixelRatio},listen(target,type,fn,options){target.addEventListener(type,fn,options);return()=>target.removeEventListener(type,fn,options)},later(fn,ms){if(scenario==="draw"&&ms===700)return 0;const id=setTimeout(()=>{jobs.delete(id);fn()},ms);jobs.add(id);return id},frame(fn){let id;const tick=time=>{frames.delete(id);if(controller.signal.aborted)return;if(fn(time)!==false){id=requestAnimationFrame(tick);frames.add(id)}};id=requestAnimationFrame(tick);frames.add(id);return()=>{cancelAnimationFrame(id);frames.delete(id)}},setDeadline(ms,fn){deadline=fn;return 1},finish(correct,detail){if(finished.length)return false;finished.push({correct,detail});result.textContent=correct?"正解":"不正解";return true}};game.render(task,context);const api=qa[game.metadata.id],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const weak=index=>{const round=task.rounds[index],choices=round.units.flatMap(unit=>round.sets.map(set=>({unitId:unit.id,setId:set.id,out:api.outcome(index,unit.id,set.id)})));return choices.sort((a,b)=>a.out.damage-b.out.damage)[0]};const choose=choice=>{api.selectUnit(choice.unitId);api.selectSet(choice.setId)};
if(scenario==="draw")await wait(140);else if(scenario.startsWith("reduced-")){if(scenario==="reduced-draw")await wait(60);else{await wait(220);if(scenario==="reduced-deploy"){api.selectUnit(task.answer[0].unitId);await wait(40)}else if(scenario==="reduced-set"){api.selectUnit(task.answer[0].unitId);await wait(150);api.selectSet(task.answer[0].setId);await wait(40)}else if(scenario==="reduced-attack"||scenario==="reduced-impact"){api.selectUnit(task.answer[0].unitId);await wait(150);api.selectSet(task.answer[0].setId);await wait(170);api.attack();await wait(scenario==="reduced-attack"?60:250)}}}else{await wait(780);if(scenario==="deploy"){api.selectUnit(task.answer[0].unitId);await wait(120)}else if(scenario==="set"){choose(task.answer[0]);await wait(120)}else if(scenario==="attack"){choose(task.answer[0]);api.attack();await wait(980)}else if(scenario==="counter"){choose(weak(0));api.attack();await wait(980)}else if(scenario==="success"){for(let i=0;i<3;i++){choose(task.answer[i]);api.attack();await wait(i<2?2550:2200)}}else if(scenario==="failure"){for(let i=0;i<2&&!api.inspect().done;i++){choose(weak(i));api.attack();await wait(i===0?2550:2200)}}else if(scenario==="timeout"){deadline();await wait(40)}else if(scenario==="invalid"){api.selectSet(task.rounds[0].sets[0].id);await wait(100)}}
document.body.dataset.ready="true";window.__CARD_FIXTURE__={game,task,api,context,finished,activeJobs:()=>jobs.size,activeFrames:()=>frames.size,dispose(){controller.abort();for(const id of jobs)clearTimeout(id);for(const id of frames)cancelAnimationFrame(id);jobs.clear();frames.clear()}};
</script></body></html>
