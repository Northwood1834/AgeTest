n id="shell" class="question-card"><div class="timer-track"><i></i></div><p class="question-kicker">問題タイプ · 記憶</p><h2></h2><p class="question-help"></p><div id="host" class="challenge"></div></main><script type="module">

const params=new URLSearchParams(location.search),mode=params.get("mode")||"module",scenario=params.get("scenario")||"initial",reduced=params.get("reduced")==="1",live=params.get("live")==="1",task={kind:"flashChoice",prompt:"数字を逆から思い出して",help:"4つの順番を覚えてください。",afterHelp:"逆の順番はどれ？",shown:["9","4","1","7"],options:["1 → 7 → 9 → 4","7 → 1 → 4 → 9","7 → 4 → 1 → 9","9 → 4 → 1 → 7"],answer:"7 → 1 → 4 → 9",duration:8500},taskJSON=JSON.stringify(task),host=document.querySelector("#host"),help=document.querySelector(".question-help"),errors=[],external=[],finishes=[],jobs=[],listeners=[];document.querySelector("h2").textContent=task.prompt;help.textContent=task.help;let clock=0,deadline=null,api=null,liveRuntime=null;

window.__MEMORY_REVERSE_FIXTURE__={game,task,taskJSON,mode,scenario,reduced,live,api:()=>api,errors,external,finishes,liveRenderedAt:()=>window.__liveRenderedAt??null,activeJobs:()=>liveRuntime?liveRuntime.inspect().timeouts:jobs.filter(value=>value.active).length,activeFrames:()=>liveRuntime?liveRuntime.inspect().frames:0,runtimeInspect:()=>liveRuntime?.inspect()||null,triggerDeadline:()=>{if(deadline?.active){deadline.active=false;deadline.fn()}},dispose:()=>{if(liveRuntime)liveRuntime.dispose();else{jobs.forEach(value=>value.active=false);deadline&&(deadline.active=false);listeners.forEach(remove=>remove());window.__fixtureAbort?.()}},report:()=>({mode,scenario,reduced,live,task,taskJSON,inspect:api.inspect(),errors:[...errors],external:[...external],finishes:[...finishes],jobs:liveRuntime?liveRuntime.inspect().timeouts:jobs.filter(value=>value.active).length,frames:liveRuntime?liveRuntime.inspect().frames:0,deadline:deadline?{ms:deadline.ms,active:deadline.active}:null})};try{await prepare();for(const entry of performance.getEntriesByType("resource")){if(new URL(entry.name,location.href).origin!==location.origin)external.push(entry.name)}document.body.dataset.ready="true"}catch(error){errors.push(String(error.stack||error));document.body.dataset.ready="error"}
