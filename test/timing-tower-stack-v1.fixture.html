<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>timing-tower-stack-v1 module fixture</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#f5f0f7;color:#403647;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}body{display:flex;justify-content:center}main{width:100%;max-width:29rem;min-height:100dvh;padding:1.65rem 1.15rem 2.2rem}.fixture-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 .55rem;padding:0 .1rem;color:#684578;font-size:.72rem;font-weight:900}.fixture-card{padding:1.25rem 1rem 1.1rem;border:1px solid #e2d6e8;border-radius:1.4rem;background:rgba(255,255,255,.95);box-shadow:0 7px 24px rgba(65,39,76,.12)}h1{margin:0 0 .2rem;text-align:center;font-size:1.35rem;line-height:1.35}.help{margin:0 0 .65rem;color:#786b80;text-align:center;font-size:.78rem;font-weight:700;line-height:1.4}.result{min-height:1.4rem;margin:.55rem 0 0;color:#2d6447;text-align:center;font-size:.78rem;font-weight:900}</style></head>
<body><main><header class="fixture-head"><span>初老テスト。module</span><span id="fixture-label"></span></header><section class="fixture-card"><h1 id="prompt"></h1><p class="help" id="help"></p><div id="game-host"></div><p class="result" id="fixture-result" aria-live="polite"></p></section></main>
<script type="module">
import game from "../src/games/timing-tower-stack-v1.js";
import {createGameRuntime} from "../src/game-kernel.js";
const FIXED_TASK={kind:"towerStack",prompt:"5段まで積み上げて",help:"左右に動くブロックをタップで落とします。はみ出た分は切り落とされ、外すと失敗です。",target:5,speed:.66,startWidth:.57,hue:3,duration:40000};
const host=document.querySelector("#game-host"),label=document.querySelector("#fixture-label"),prompt=document.querySelector("#prompt"),help=document.querySelector("#help"),resultNode=document.querySelector("#fixture-result"),errors=[];
let runtime=null,qa=null,result=null,lastTask=null;
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function start({task=FIXED_TASK,width=innerWidth,height=innerHeight,dpr=devicePixelRatio,reduced=false,deadlineOverride=null}={}){
  runtime?.dispose();host.replaceChildren();qa={};result=null;resultNode.textContent="";lastTask=structuredClone(task);prompt.textContent=lastTask.prompt;help.textContent=lastTask.help;
  runtime=createGameRuntime({host,qa,reducedMotion:reduced,viewport:{width,height,dpr},onFinish:(correct,detail)=>{result={correct,detail};resultNode.textContent=`${correct?"成功":"失敗"} · ${detail.detail||detail.reason||""}`}});
  const context={...runtime.context,qa,reducedMotion:reduced,viewport:{width,height,dpr}};
  if(deadlineOverride!==null){const owned=context.setDeadline;context.setDeadline=(_ms,fn)=>owned(deadlineOverride,fn)}
  game.render(lastTask,context);label.textContent=`${width}×${height} DPR${dpr}${reduced?" reduced":""}`;return structuredClone(lastTask);
}
async function scenario(name){
  const api=qa[game.metadata.id];
  if(name==="motion")await wait(420);
  else if(name==="landed"){api.align();api.drop();await wait(230)}
  else if(name==="trim"){const below=api.inspect().stack.at(-1);api.setX(below.x+.14);api.drop();await wait(230)}
  else if(name==="near-miss"){const below=api.inspect().stack.at(-1);api.setX(below.x+below.w-.022);api.drop();await wait(230)}
  else if(name==="success"){for(let level=0;level<lastTask.target;level++){api.align();api.drop();await wait(230)}await wait(260)}
  else if(name==="failure"){api.setX(.88);api.drop();await wait(120)}
  await wait(35);document.body.dataset.ready="true";document.body.dataset.scenario=name;
}
window.towerFixture={game,start,scenario,dispose(){runtime?.dispose()},inspect(){return qa?.[game.metadata.id]?.inspect?.()||null},drop(){return qa?.[game.metadata.id]?.drop?.()},align(){return qa?.[game.metadata.id]?.align?.()},setX(value){return qa?.[game.metadata.id]?.setX?.(value)},runtime(){return runtime?.inspect()||null},task(){return structuredClone(lastTask)},result(){return result?structuredClone(result):null},errors(){return[...errors]}};
const query=new URLSearchParams(location.search),name=query.get("scenario")||"initial",reduced=query.get("reduced")==="1",deadline=name==="timeout"?120:null;start({width:innerWidth,height:innerHeight,dpr:devicePixelRatio,reduced,deadlineOverride:deadline});if(name==="timeout"){await wait(180);document.body.dataset.ready="true";document.body.dataset.scenario=name}else await scenario(name);
</script></body></html>
