<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>朝の一席 fixture</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8eceb;font-family:system-ui,-apple-system,sans-serif}body{padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}#shell{width:100%;max-width:430px;margin:auto}h1{margin:.08rem 0 .2rem;text-align:center;color:#263b40;font-size:.95rem}#result{min-height:1.05em;margin:.12rem 0;text-align:center;color:#526468;font-size:.7rem;font-weight:850}</style></head>
<body><main id="shell"><h1>朝の一席</h1><div id="host"></div><p id="result"></p></main><script>window.__FIXTURE_ERRORS__=[];const oldError=console.error.bind(console);console.error=(...args)=>{__FIXTURE_ERRORS__.push(args.map(String).join(" "));oldError(...args)};addEventListener("error",event=>__FIXTURE_ERRORS__.push(event.error?.stack||event.message));addEventListener("unhandledrejection",event=>__FIXTURE_ERRORS__.push(event.reason?.stack||String(event.reason)));</script>
<script type="module">
import game from "../src/games/spatial-commuter-seat-v1.js";
const params=new URLSearchParams(location.search),scenario=params.get("scenario")||"initial",seedValue=Number(params.get("seed"))||2020;let seed=seedValue>>>0;const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/2**32),randomInt=(a,b)=>a+Math.floor(random()*(b-a+1));const task=game.generate({random,randomInt,shuffle:v=>[...v],pick:v=>v[randomInt(0,v.length-1)]});
const host=document.querySelector("#host"),result=document.querySelector("#result"),controller=new AbortController(),qa={},jobs=new Set(),frames=new Set(),finished=[];let deadline=null;const context={host,signal:controller.signal,qa,reducedMotion:params.get("reduced")==="1",viewport:{width:innerWidth-12,height:innerHeight,dpr:devicePixelRatio},listen(target,type,fn,options){target.addEventListener(type,fn,options);return()=>target.removeEventListener(type,fn,options)},later(fn,ms){const freeze=scenario==="preview"&&(ms===90||ms===140)||scenario==="moving"&&(context.reducedMotion?ms===140:ms===300)||scenario==="arrival"&&(context.reducedMotion?ms===70:ms===110),delayMs=freeze?60000:ms,id=setTimeout(()=>{jobs.delete(id);fn()},delayMs);jobs.add(id);return id},frame(fn){let id;const tick=time=>{frames.delete(id);if(controller.signal.aborted)return;if(fn(time)!==false){id=requestAnimationFrame(tick);frames.add(id)}};id=requestAnimationFrame(tick);frames.add(id);return()=>{cancelAnimationFrame(id);frames.delete(id)}},setDeadline(ms,fn){deadline=fn;return 1},finish(correct,detail){if(finished.length)return false;finished.push({correct,detail});result.textContent=correct?"着席":"失敗";return true}};game.render(task,context);const api=qa[game.metadata.id],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const allPaths=()=>{const out=[];for(const a of task.layers[0])for(const b of task.layers[1])for(const c of task.layers[2])for(const d of task.layers[3])out.push([a.id,b.id,c.id,d.id]);return out},forReason=reason=>allPaths().find(path=>api.simulate(path).reason===reason),play=async(path,stopNear=false)=>{for(const id of path){if(api.inspect().done)break;api.choose(id);api.commit();await wait(context.reducedMotion?330:590);if(stopNear&&api.inspect().near)break}};
if(scenario==="initial")await wait(50);else if(scenario==="route-select"){api.choose(task.answer[0]);await wait(60)}else if(scenario==="preview"){api.choose(task.answer[0]);api.commit();await wait(context.reducedMotion?40:60)}else if(scenario==="moving"){api.choose(task.answer[0]);api.commit();await wait(context.reducedMotion?130:250)}else if(scenario==="arrival"){api.choose(task.answer[0]);api.commit();await wait(context.reducedMotion?250:480)}else if(scenario==="near-miss"){await play(task.nearRoute,true);await wait(40)}else if(scenario==="invalid"){api.choose("missing-node");await wait(90)}else if(scenario==="success"){await play(task.answer);await wait(context.reducedMotion?220:720)}else if(scenario==="fail"||scenario==="collision"){await play(forReason("collision"));await wait(context.reducedMotion?220:720)}else if(scenario==="blocked"){await play(forReason("blocked-alighter"));await wait(context.reducedMotion?220:720)}else if(scenario==="seat-taken"){await play(forReason("seat-taken"));await wait(context.reducedMotion?220:720)}else if(scenario==="door-close"){await play(forReason("door-close"));await wait(context.reducedMotion?220:720)}else if(scenario==="timeout"){deadline();await wait(context.reducedMotion?220:720)}
document.body.dataset.ready="true";window.__COMMUTER_FIXTURE__={game,task,api,context,finished,activeJobs:()=>jobs.size,activeFrames:()=>frames.size,dispose(){controller.abort();for(const id of jobs)clearTimeout(id);for(const id of frames)cancelAnimationFrame(id);jobs.clear();frames.clear()}};
</script></body></html>
