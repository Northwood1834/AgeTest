<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>spatial-emoji-fps-v1 published legacy fixture</title><style>:root{--line:#d8cadf}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#f0eaf3;color:#3e3542;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}body{display:flex;justify-content:center}main{width:100%;max-width:29rem;min-height:100dvh;padding:1.45rem 1.05rem 2.1rem}.fixture-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 .5rem;color:#724f82;font-size:.71rem;font-weight:900}.fixture-card{padding:1.1rem .9rem 1rem;border:1px solid #ded1e4;border-radius:1.35rem;background:rgba(255,255,255,.96);box-shadow:0 8px 25px rgba(62,42,73,.13)}h1{margin:0 0 .18rem;text-align:center;font-size:1.23rem;line-height:1.3}.help{margin:0 0 .6rem;color:#776a7d;text-align:center;font-size:.78rem;font-weight:700;line-height:1.38}.stage3d{--stage-perspective:520px;position:relative;width:100%;height:12rem;margin-bottom:.75rem;overflow:hidden;border:1.5px solid var(--line);border-radius:1.25rem;background:#F8F3FA;perspective:var(--stage-perspective);isolation:isolate}.stage3d-world{position:absolute;inset:0;transform-style:preserve-3d}.stage3d-entity{position:absolute;left:var(--entity-x);top:var(--entity-y);z-index:2;border:0;background:transparent;font-size:2rem;line-height:1;transform:translate(-50%,-50%) translateZ(var(--entity-z)) scale(var(--entity-scale));transform-style:preserve-3d;filter:drop-shadow(0 5px 4px rgba(45,26,54,.22))}.fps-stage{--stage-perspective:430px;height:14rem;background:radial-gradient(ellipse at 50% 48%,#6A4A78 0 9%,#3C2948 31%,#1C1223 75%);border-color:#674875;box-shadow:inset 0 0 35px rgba(0,0,0,.38)}.fps-stage .stage3d-world{pointer-events:none}.fps-stage::before,.fps-stage::after{content:"";position:absolute;z-index:0;left:50%;width:145%;height:78%;border:2px solid rgba(220,183,235,.3);transform-origin:center}.fps-stage::before{top:-38%;transform:translateX(-50%) rotateX(69deg);background:repeating-linear-gradient(90deg,transparent 0 11%,rgba(211,170,229,.2) 12%),repeating-linear-gradient(0deg,transparent 0 18%,rgba(211,170,229,.18) 19%)}.fps-stage::after{bottom:-38%;transform:translateX(-50%) rotateX(-69deg);background:repeating-linear-gradient(90deg,transparent 0 11%,rgba(211,170,229,.22) 12%),repeating-linear-gradient(0deg,transparent 0 18%,rgba(211,170,229,.2) 19%)}.fps-tunnel{position:absolute;inset:0;background:repeating-conic-gradient(from 2deg at 50% 48%,transparent 0 13deg,rgba(224,195,238,.2) 14deg 15deg,transparent 16deg 44deg);pointer-events:none}.fps-tunnel::before{content:"";position:absolute;left:50%;top:48%;width:21%;height:24%;transform:translate(-50%,-50%);border:2px solid rgba(235,213,244,.42);box-shadow:0 0 0 24px rgba(219,181,234,.05),0 0 0 49px rgba(219,181,234,.04),0 0 0 75px rgba(219,181,234,.03)}.fps-crosshair{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);color:rgba(255,255,255,.72);font-size:2.7rem;font-weight:200;text-shadow:0 0 8px #DDB8EE;pointer-events:none}.fps-target{z-index:6;pointer-events:auto;width:3.15rem;height:3.15rem;display:grid;place-items:center;border:1.5px solid rgba(235,215,244,.62);border-radius:50%;background:rgba(53,31,63,.55);font-size:1.85rem;animation:fps-float 1.2s ease-in-out var(--float-delay) infinite alternate;box-shadow:0 0 0 3px rgba(185,120,215,.08)}.fps-target:active{background:rgba(166,109,194,.65)}.fps-counter{position:absolute;z-index:8;right:.55rem;bottom:.45rem;padding:.24rem .5rem;border:1px solid rgba(235,213,244,.35);border-radius:999px;background:rgba(24,14,29,.76);color:#F0DDF8;font:800 .62rem ui-monospace,SFMono-Regular,monospace;letter-spacing:.08em}@keyframes fps-float{to{margin-top:-6px;filter:drop-shadow(0 8px 5px rgba(0,0,0,.32)) brightness(1.1)}}body[data-reduced=true] *{animation:none!important;transition:none!important}.result{min-height:1.35rem;margin:.5rem 0 0;padding:.45rem .6rem;border-radius:.72rem;color:#355f40;text-align:center;font-size:.76rem;font-weight:900}.result[data-correct=false]{background:#f8e3e7;color:#873847}.result[data-correct=true]{background:#e4f3e8;color:#326344}</style></head><body><main><header class="fixture-head"><span>初老テスト。published legacy</span><span id="fixture-label"></span></header><section class="fixture-card"><h1>🤓だけを3体ロックオン</h1><p class="help">😀・🤑・動物は押さないで。</p><div id="challenge"></div><p class="result" id="legacy-result" hidden></p></section></main><script>
const FIXED_TASK={kind:"emojiFps",prompt:"🤓だけを3体ロックオン",help:"😀・🤑・動物は押さないで。",targets:["🤓","😀","🐶","🤓","🤑","🐱","🐼","🤓"],duration:8000},POSITIONS=[[21,25,-30,.9],[49,22,20,1.05],[76,28,-10,.95],[29,50,35,1.13],[67,52,5,1],[20,69,-20,.88],[49,72,45,1.16],[78,67,-5,.94]],challenge=document.querySelector("#challenge"),resultNode=document.querySelector("#legacy-result"),label=document.querySelector("#fixture-label"),errors=[];let buttons=[],hits=0,result=null;
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
function createStage3D(sceneClass,labelText){const root=document.createElement("div"),world=document.createElement("div");root.className=`stage3d ${sceneClass}`;root.setAttribute("role","group");root.setAttribute("aria-label",labelText);world.className="stage3d-world";root.append(world);return{root,world}}
function addEmojiEntity(world,{emoji,labelText,x,y,z=0,scale=1,onSelect}){const button=document.createElement("button");button.type="button";button.className="stage3d-entity";button.textContent=emoji;button.setAttribute("aria-label",labelText||emoji);button.style.setProperty("--entity-x",`${x}%`);button.style.setProperty("--entity-y",`${y}%`);button.style.setProperty("--entity-z",`${z}px`);button.style.setProperty("--entity-scale",scale);button.addEventListener("click",onSelect);world.append(button);return button}
function finish(correct,detail){if(result)return;result={correct,detail};resultNode.hidden=false;resultNode.dataset.correct=String(correct);resultNode.textContent=`${correct?"成功":"失敗"} · ${detail}`}
function render(){challenge.replaceChildren();const scene=createStage3D("fps-stage","絵文字をロックオンする3D通路"),tunnel=document.createElement("div"),crosshair=document.createElement("span"),counter=document.createElement("span");tunnel.className="fps-tunnel";crosshair.className="fps-crosshair";crosshair.textContent="＋";counter.className="fps-counter";counter.textContent="LOCK 0 / 3";scene.world.append(tunnel,crosshair,counter);challenge.append(scene.root);hits=0;buttons=FIXED_TASK.targets.map((emoji,index)=>{const[x,y,z,scale]=POSITIONS[index],entity=addEmojiEntity(scene.world,{emoji,labelText:`${emoji}をロックオン`,x,y,z,scale,onSelect:event=>{event.stopPropagation();if(emoji!=="🤓"){finish(false,`${emoji}は一般通行人でした。`);return}entity.remove();hits++;counter.textContent=`LOCK ${hits} / 3`;if(hits===3)finish(true,"🤓を全員ロックオンしました。")}});entity.classList.add("fps-target");entity.style.setProperty("--float-delay",`${index*-.18}s`);entity.dataset.index=String(index);return entity});return{scene,counter}}
const built=render();function select(index){if(result||!buttons[index]?.isConnected)return false;buttons[index].click();return true}function scenario(name){if(name==="focus")buttons[3].focus();else if(name==="lock1")select(0);else if(name==="lock2"){select(0);select(3)}else if(name==="bystander")select(1);else if(name==="success"){select(0);select(3);select(7)}else if(name==="timeout")finish(false,"🤓が3D通路へ消えました。");document.body.dataset.ready="true";document.body.dataset.scenario=name}
window.emojiFpsLegacy={task:()=>structuredClone(FIXED_TASK),positions:()=>structuredClone(POSITIONS),select,scenario,inspect:()=>({hits,active:buttons.map(button=>button.isConnected),result:result?structuredClone(result):null,counter:built.counter.textContent,focusIndex:buttons.indexOf(document.activeElement)}),errors:()=>[...errors]};const query=new URLSearchParams(location.search),name=query.get("scenario")||"initial",reduced=query.get("reduced")==="1";document.body.dataset.reduced=String(reduced);label.textContent=`${innerWidth}×${innerHeight} DPR${devicePixelRatio}${reduced?" reduced":""}`;scenario(name);
</script></body></html>
