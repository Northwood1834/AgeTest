<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>memory-phone-pin-v1 fixture</title><style>html,body{margin:0;min-height:100%;background:#0d161c}body{display:flex;justify-content:center}#host{width:100%;min-height:100vh}</style></head>
<body><main id="host"></main><script type="module">
import game from "../src/games/memory-phone-pin-v1.js";
const params=new URLSearchParams(location.search),scenario=params.get("scenario")||"encoding",reduced=params.get("reduced")==="1",seedStart=Number(params.get("seed")||9117)>>>0,host=document.querySelector("#host"),qa={},errors=[],external=[],finishes=[],jobs=new Map(),listeners=[],controller=new AbortController();let seed=seedStart,nextJob=0,deadline=null,disposed=false;
const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/2**32),randomInt=(a,b)=>a+Math.floor(random()*(b-a+1)),shuffle=value=>{const array=[...value];for(let i=array.length-1;i;i--){const j=randomInt(0,i);[array[i],array[j]]=[array[j],array[i]]}return array},task=game.generate({random,randomInt,shuffle,pick:value=>value[randomInt(0,value.length-1)]});
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message||event.error)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
const later=(fn,ms)=>{const token=++nextJob,id=setTimeout(()=>{jobs.delete(token);if(!disposed)fn()},ms);jobs.set(token,{id,kind:"later",ms});return()=>{clearTimeout(id);jobs.delete(token)}};
const context={host,signal:controller.signal,reducedMotion:reduced,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},qa,later,frame:fn=>{let active=true,id=0;const tick=time=>{if(!active||disposed)return;if(fn(time)!==false)id=requestAnimationFrame(tick)};id=requestAnimationFrame(tick);return()=>{active=false;cancelAnimationFrame(id)}},listen:(target,type,fn,options)=>{target.addEventListener(type,fn,options);const remove=()=>target.removeEventListener(type,fn,options);listeners.push(remove);return remove},setDeadline:(ms,fn)=>{const token=++nextJob,id=setTimeout(()=>{jobs.delete(token);deadline=null;if(!disposed)fn()},ms);deadline={token,id,fn};jobs.set(token,{id,kind:"deadline",ms});return id},finish:(correct,result)=>finishes.push({correct,result,time:performance.now()})};
game.render(task,context);const api=qa[game.metadata.id],sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms)),wait=async(predicate,timeout=6000)=>{const start=performance.now();while(!predicate()){if(performance.now()-start>timeout)throw new Error(`fixture wait timeout: ${scenario}`);await sleep(16)}},enter=code=>{for(const digit of code)api.press(digit)},bad=`${(Number(task.pin[0])+1)%10}${task.pin.slice(1)}`;
async function prepare(){if(scenario==="encoding")return;if(scenario==="veil"){await wait(()=>api.inspect().phase==="VEIL");return}api.forceCue();if(scenario==="cue")return;if(scenario==="input"){api.press(task.pin[0]);api.press(task.pin[1]);return}if(scenario==="wrong1"){enter(bad);await wait(()=>api.inspect().phase==="WRONG");return}if(scenario==="wrong2"){enter(bad);await wait(()=>api.inspect().phase==="CUE");enter(bad);await wait(()=>api.inspect().phase==="WRONG");return}if(scenario==="success"){enter(task.pin);await wait(()=>api.inspect().done);return}if(scenario==="lockout"){for(let attempt=0;attempt<3;attempt++){enter(bad);if(attempt<2)await wait(()=>api.inspect().phase==="CUE");else await wait(()=>api.inspect().done)}return}if(scenario==="timeout"){deadline.fn();clearTimeout(deadline.id);jobs.delete(deadline.token);deadline=null;await wait(()=>api.inspect().done);return}throw new Error(`unknown scenario ${scenario}`)}
window.__PHONE_FIXTURE__={game,task,api,scenario,reduced,errors,external,finishes,activeJobs:()=>jobs.size,activeFrames:()=>0,triggerDeadline:()=>{if(deadline){deadline.fn();clearTimeout(deadline.id);jobs.delete(deadline.token);deadline=null}},dispose:()=>{if(disposed)return;disposed=true;for(const job of jobs.values())clearTimeout(job.id);jobs.clear();controller.abort();listeners.forEach(remove=>remove())},report:()=>({scenario,reduced,task,inspect:api.inspect(),errors:[...errors],external:[...external],finishes:[...finishes],jobs:jobs.size})};
try{await prepare();for(const entry of performance.getEntriesByType("resource")){const url=new URL(entry.name,location.href);if(url.origin!==location.origin)external.push(entry.name)}document.body.dataset.ready="true"}catch(error){errors.push(String(error.stack||error));document.body.dataset.ready="error"}
</script></body></html>
