<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rope visual QC</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#f8f3fa;font-family:system-ui,-apple-system,sans-serif}main{width:100%;max-width:430px;margin:auto;padding:8px}#label{margin:.2rem;text-align:center;color:#61436f;font-size:.8rem;font-weight:900}</style></head><body><main><p id="label"></p><div id="host"></div></main><script type="module">
import game from "../src/games/spatial-rope-untangle-v1.js";
const query=new URLSearchParams(location.search),scenario=query.get("scenario")||"initial",wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),task=JSON.parse(sessionStorage.getItem("ropeVisualTask")||"null");if(!task)throw Error("ropeVisualTask required");task.solution=Array.from({length:task.nodes},(_,i)=>{const a=-Math.PI/2+i*Math.PI*2/task.nodes;return{x:.5+Math.cos(a)*.36,y:.5+Math.sin(a)*.36}});document.querySelector("#label").textContent=`MODULE · ${scenario} · 交差${task.start}本`;
const host=document.querySelector("#host"),controller=new AbortController(),qa={},timers=new Set(),frames=new Set();let deadline=null,finish=null;const context={host,signal:controller.signal,qa,reducedMotion:false,viewport:{width:innerWidth-16,height:innerHeight,dpr:devicePixelRatio},listen(target,type,fn,options){target.addEventListener(type,fn,options);return()=>target.removeEventListener(type,fn,options)},later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id},frame(fn){let id,stopped=false;const tick=time=>{frames.delete(id);if(stopped)return;if(fn(time)!==false){id=requestAnimationFrame(tick);frames.add(id)}};id=requestAnimationFrame(tick);frames.add(id);return()=>{stopped=true;cancelAnimationFrame(id)}},setDeadline(ms,fn){deadline=fn;return 1},finish(correct,result){finish={correct,result};return true}};game.render(task,context);const api=qa[game.metadata.id],pegs=()=>host.querySelectorAll(".aru-peg");
if(scenario==="dragging"){const index=0,button=pegs()[0],rect=button.getBoundingClientRect(),board=host.querySelector(".aru-board").getBoundingClientRect(),target=task.solution[0],pointerId=7;button.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerId,clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2}));button.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,pointerId,clientX:board.left+(task.points[0].x+target.x)/2*board.width,clientY:board.top+(task.points[0].y+target.y)/2*board.height}));await wait(80)}
