<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>prediction-pin-pull-v1 fixture</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f0f7;font-family:system-ui,sans-serif}body{display:grid;justify-items:center;align-content:start;padding:1rem 0}.fixture-shell{max-width:100%;padding:.5rem}.fixture-meta{margin:0 0 .5rem;color:#51445a;font-size:.8rem}.fixture-result{min-height:1.5rem;margin:.5rem 0;color:#2c5d45;font-weight:800}
</style>
</head>
<body>
<main class="fixture-shell"><p class="fixture-meta" id="fixture-meta"></p><div id="game-host"></div><p class="fixture-result" id="fixture-result" aria-live="polite"></p></main>
<script type="module">
import game from "../src/games/prediction-pin-pull-v1.js";
import {createGameRuntime} from "../src/game-kernel.js";

const host=document.querySelector("#game-host"),meta=document.querySelector("#fixture-meta"),resultNode=document.querySelector("#fixture-result");
let runtime=null,result=null,qa=null,lastTask=null;
const fixtureErrors=[];
window.addEventListener("error",event=>fixtureErrors.push(String(event.error?.stack||event.message)));
window.addEventListener("unhandledrejection",event=>fixtureErrors.push(String(event.reason?.stack||event.reason)));
const helpersFor=candidate=>({randomInt:(min,max)=>Math.max(min,Math.min(max,candidate))});

function start({candidate=0,task=null,width=390,height=844,dpr=window.devicePixelRatio,reduced=false,deadlineOverride=null}={}){
  runtime?.dispose();host.replaceChildren();result=null;qa={};resultNode.textContent="";
  host.style.width=`${width}px`;lastTask=task?structuredClone(task):game.generate(helpersFor(candidate));
  runtime=createGameRuntime({host,reducedMotion:reduced,viewport:{width,height,dpr},qa,onFinish:(correct,detail)=>{
    result={correct,detail};resultNode.textContent=`${correct?"correct":"wrong"}: ${detail.reason||"none"}`;
  }});
  const context={...runtime.context,reducedMotion:reduced,viewport:{width,height,dpr},qa};
  if(deadlineOverride!==null){
    const ownedSetDeadline=context.setDeadline;
    context.setDeadline=(_ms,fn)=>ownedSetDeadline(deadlineOverride,fn);
  }
  game.render(lastTask,context);
  meta.textContent=`${width}px / DPR ${dpr} / ${reduced?"reduced":"motion"}`;
  return structuredClone(lastTask);
}

window.pinFixture={
  game,start,
  dispose(){runtime?.dispose()},
  inspect(){return runtime?.inspect()||null},
  snapshot(){return qa?.snapshot?.()||null},
  pull(index){return qa?.pull?.(index)},
  outcomes(){return qa?.outcomes?.map(outcome=>({...outcome,order:[...outcome.order]}))||[]},
  task(){return structuredClone(lastTask)},
  result(){return result?structuredClone(result):null},
  errors(){return[...fixtureErrors]},
  qa(){return qa}
};
start();
</script>
</body>
</html>
