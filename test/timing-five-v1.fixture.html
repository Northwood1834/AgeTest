<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>timing-five-v1 parity fixture</title><style>html,body{margin:0;min-height:100%;background:#e9e4eb;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}body{display:flex;justify-content:center}#shell{width:100%;max-width:430px;min-height:100vh;padding:1rem;box-sizing:border-box;color:#342d38;background:#f7f4f8}.timer-track{display:none}.question-card{text-align:center}.question-kicker{margin:.1rem 0;color:#704184;font-size:.62rem;font-weight:900;letter-spacing:.12em}.question-card h2{min-height:3.3rem;margin:.25rem 0;font-size:1.23rem;line-height:1.45}.question-help{min-height:1.5rem;margin:.15rem 0 .45rem;color:#76657f;font-size:.74rem;font-weight:650}.challenge{margin-top:.45rem}.legacy-timing-display{min-height:7rem;display:grid;place-items:center;margin-bottom:.8rem}.legacy-timing-orb{width:5.5rem;height:5.5rem;border-radius:50%;background:radial-gradient(circle at 35% 28%,#f4e3fa,#b478d0 55%,#80519a);box-shadow:0 10px 24px rgba(128,81,154,.22)}.legacy-timing-orb.running{filter:saturate(1.15);box-shadow:0 0 0 7px rgba(166,109,194,.2),0 10px 24px rgba(128,81,154,.22)}.legacy-signal-button{width:100%;min-height:11rem;border:0;border-radius:1.5rem;background:#eee8f1;color:#76657f;font-size:1.6rem;font-weight:950;letter-spacing:.04em;box-shadow:inset 0 -7px rgba(80,57,91,.06)}.legacy-signal-button:disabled{opacity:1}.legacy-signal-button:focus-visible{outline:3px solid #f2a63a;outline-offset:4px}.legacy-signal-button.go{background:linear-gradient(145deg,#a76bc2,#704184);color:#fff;box-shadow:0 10px 25px rgba(128,81,154,.28)}.legacy-feedback{margin-top:.7rem;padding:.65rem;border:1.5px solid #8ebda2;border-radius:1rem;background:#eef8f1;text-align:center}.legacy-feedback.bad{border-color:#d8959c;background:#fff0f1}.legacy-feedback b,.legacy-feedback span{display:block}.legacy-feedback span{margin-top:.2rem;font-size:.74rem}</style></head><body><main id="shell" class="question-card"><div class="timer-track"><i></i></div><p class="question-kicker">問題タイプ · タイミング</p><h2></h2><p class="question-help"></p><div id="host" class="challenge"></div></main><script type="module">
import game from "../src/games/timing-five-v1.js";
import {createGameRuntime} from "../src/game-kernel.js";
const params=new URLSearchParams(location.search),mode=params.get("mode")||"module",scenario=params.get("scenario")||"countdown3",reduced=params.get("reduced")==="1",live=params.get("live")==="1",task={kind:"timing",prompt:"体内時計で5秒を測って",help:"スタート後、5秒だと思ったらタップ。",targetSeconds:5,toleranceMs:800,duration:12000},taskJSON=JSON.stringify(task),host=document.querySelector("#host"),help=document.querySelector(".question-help"),errors=[],external=[],finishes=[],jobs=[],listeners=[];document.querySelector("h2").textContent=task.prompt;help.textContent="3・2・1のあと、自動で計測が始まります。";let clock=0,deadline=null,api=null,disposed=false,liveRuntime=null;
addEventListener("error",event=>errors.push(String(event.error?.stack||event.message||event.error)));addEventListener("unhandledrejection",event=>errors.push(String(event.reason?.stack||event.reason)));
const showLegacyFeedback=(correct,result)=>{const box=document.createElement("div"),title=document.createElement("b"),detail=document.createElement("span");box.className=`legacy-feedback${correct?"":" bad"}`;title.textContent=correct?"○ 正解":"× 残念";detail.textContent=result.detail;box.append(title,detail);host.append(box)};
function renderLegacy(){const display=document.createElement("div"),orb=document.createElement("div"),button=document.createElement("button");display.className="legacy-timing-display";orb.className="legacy-timing-orb";display.append(orb);button.type="button";button.className="legacy-signal-button";button.textContent="3";button.disabled=true;button.setAttribute("aria-live","polite");let started=0,done=false,result=null,finishCalls=0,phase="COUNTDOWN_3";const seconds=task.targetSeconds||3,target=seconds*1000,tolerance=task.toleranceMs||650;const finish=(correct,nextResult,nextPhase)=>{if(done)return false;done=true;result=nextResult;finishCalls++;phase=nextPhase;button.disabled=true;showLegacyFeedback(correct,nextResult);finishes.push({correct,result:nextResult});return true},begin=()=>{if(done)return false;started=clock;button.disabled=false;button.textContent=`${seconds}秒だと思ったら、タップ！`;button.classList.add("go");orb.classList.add("running");help.textContent="数字は出ません。己を信じて。";button.focus({preventScroll:true});phase="RUNNING";deadline={ms:target+2200,fn:()=>finish(false,{detail:`${seconds+2}秒を超えました。時空から戻ってください。`},"TIMEOUT"),active:true};return true},stop=()=>{if(!started||done)return false;const elapsed=clock-started,diff=Math.abs(elapsed-target),correct=diff<=tolerance,nextResult={reactionMs:Math.round(elapsed),quality:Math.max(0,Math.min(1,1-diff/(tolerance*2.6))),detail:`あなたの${seconds}秒は ${(elapsed/1000).toFixed(2)} 秒でした。`};return finish(correct,nextResult,correct?"WIN":elapsed<target?"EARLY":"LATE")},setCount=value=>{if(done||started)return false;button.textContent=String(value);phase=`COUNTDOWN_${value}`;return true};button.addEventListener("click",stop);host.append(display,button);jobs.push({ms:1000,fn:()=>setCount(2),active:true},{ms:2000,fn:()=>setCount(1),active:true},{ms:3000,fn:begin,active:true});api={inspect:()=>({phase,started,done,disposed:false,result,finishCalls,buttonText:button.textContent,buttonDisabled:button.disabled,status:help.textContent,outcomeHidden:!done,outcomeText:done?result.detail:"",focused:document.activeElement===button,taskJSON,timerVisible:false}),begin,stop,setCount,elements:{stage:host,status:help,display,orb,button}}}
function renderModule(){const qa={};if(live){liveRuntime=createGameRuntime({host,onFinish:(correct,result)=>finishes.push({correct,result,at:performance.now()}),reducedMotion:reduced,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},qa});window.__liveRenderedAt=performance.now();game.render(task,liveRuntime.context);api=qa[game.metadata.id];return}const controller=new AbortController(),context={host,signal:controller.signal,reducedMotion:reduced,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},qa,now:()=>clock,later:(fn,ms)=>{const job={fn,ms,active:true};jobs.push(job);return()=>job.active=false},frame:()=>{throw new Error("unexpected frame")},listen:(target,type,fn,options)=>{target.addEventListener(type,fn,options);const remove=()=>target.removeEventListener(type,fn,options);listeners.push(remove);return remove},setDeadline:(ms,fn)=>{deadline={ms,fn,active:true}},finish:(correct,result)=>finishes.push({correct,result})};game.render(task,context);api=qa[game.metadata.id];window.__fixtureAbort=()=>controller.abort()}
function run(ms){clock=ms;const job=jobs.find(value=>value.active&&value.ms===ms);if(!job)throw new Error(`missing stage ${ms}`);job.active=false;job.fn()}
function stopAt(elapsed){clock=3000+elapsed;api.elements.button.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,detail:1}))}
async function prepare(){mode==="legacy"?renderLegacy():renderModule();if(live)return;if(scenario==="countdown3")return;run(1000);if(scenario==="countdown2")return;run(2000);if(scenario==="countdown1")return;run(3000);if(scenario==="running")return;if(scenario==="early"){stopAt(4000);return}if(scenario==="win"){stopAt(5000);return}if(scenario==="late"){stopAt(6000);return}if(scenario==="timeout"){clock=10200;deadline.active=false;deadline.fn();return}if(scenario==="focus")return;throw new Error(`unknown scenario ${scenario}`)}
window.__TIMING_FIXTURE__={game,task,taskJSON,mode,scenario,reduced,live,api:()=>api,errors,external,finishes,liveRenderedAt:()=>window.__liveRenderedAt??null,activeJobs:()=>liveRuntime?liveRuntime.inspect().timeouts:jobs.filter(value=>value.active).length,activeFrames:()=>liveRuntime?liveRuntime.inspect().frames:0,runtimeInspect:()=>liveRuntime?.inspect()||null,triggerDeadline:()=>{if(deadline?.active){deadline.active=false;deadline.fn()}},dispose:()=>{disposed=true;if(liveRuntime)liveRuntime.dispose();else{jobs.forEach(value=>value.active=false);deadline&&(deadline.active=false);listeners.forEach(remove=>remove());window.__fixtureAbort?.()}},report:()=>({mode,scenario,reduced,live,task,taskJSON,inspect:api.inspect(),errors:[...errors],external:[...external],finishes:[...finishes],jobs:liveRuntime?liveRuntime.inspect().timeouts:jobs.filter(value=>value.active).length,frames:liveRuntime?liveRuntime.inspect().frames:0,deadline:deadline?{ms:deadline.ms,active:deadline.active}:null})};
try{await prepare();for(const entry of performance.getEntriesByType("resource")){if(new URL(entry.name,location.href).origin!==location.origin)external.push(entry.name)}document.body.dataset.ready="true"}catch(error){errors.push(String(error.stack||error));document.body.dataset.ready="error"}
</script></body></html>
